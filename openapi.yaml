openapi: 3.0.3
info:
  title: Memory API
  description: |
    API RESTful pour l'application de prise de notes Memory.

    ## Authentification
    Toutes les routes (sauf `/login` et `/view`) nécessitent un token JWT valide.
    Le token doit être envoyé dans l'en-tête `Authorization` avec le format `Bearer {token}`.

    ## Sécurité
    - Toutes les requêtes utilisent HTTPS en production
    - Les mots de passe sont hashés avec bcrypt
    - Gestion CORS configurée pour le frontend
    - Validation des entrées côté serveur
  version: 1.0.0
  contact:
    name: Support API Memory
    email: support@memory-api.local

servers:
  - url: http://localhost:8000/memory
    description: Serveur de développement local
  - url: http://localhost/memory
    description: Serveur WAMP local

tags:
  - name: Authentication
    description: Endpoints d'authentification et gestion des sessions
  - name: Users
    description: Gestion des utilisateurs
  - name: Notes
    description: Gestion des notes
  - name: Projects
    description: Gestion des projets
  - name: Tasks
    description: Gestion des tâches
  - name: Comments
    description: Gestion des commentaires sur les notes
  - name: Tags
    description: Gestion des tags/étiquettes
  - name: Scores
    description: Gestion des scores/notes des items
  - name: Messages
    description: Gestion de la messagerie entre utilisateurs
  - name: Shares
    description: Gestion du partage de notes
  - name: Uploads
    description: Gestion des fichiers uploadés
  - name: Technical Skills
    description: Gestion des compétences techniques des utilisateurs
  - name: Roles
    description: Gestion des rôles et permissions
  - name: Programming Languages
    description: Gestion des langages de programmation
  - name: Status
    description: Gestion des statuts

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenu via l'endpoint /login

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Message d'erreur
      required:
        - error

    User:
      type: object
      properties:
        id_user:
          type: integer
          description: ID unique de l'utilisateur
        username:
          type: string
          description: Nom d'utilisateur
        email:
          type: string
          format: email
          description: Adresse email
        avatar_url:
          type: string
          description: URL de l'avatar
        id_role:
          type: integer
          description: ID du rôle
        is_admin:
          type: boolean
          description: Indique si l'utilisateur est administrateur
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        avatar_url:
          type: string
        id_role:
          type: integer
        is_admin:
          type: boolean
          default: false

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        avatar_url:
          type: string
        id_role:
          type: integer
        is_admin:
          type: boolean

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Nom d'utilisateur ou email
        password:
          type: string
          description: Mot de passe de l'utilisateur

    LoginResponse:
      type: object
      properties:
        id_user:
          type: integer
        username:
          type: string
        email:
          type: string
        token:
          type: string
          description: Token JWT pour l'authentification
        expires_at:
          type: string
          format: date-time

    Note:
      type: object
      properties:
        id_item:
          type: integer
          description: ID unique de la note
        title:
          type: string
          description: Titre de la note
        content:
          type: string
          description: Contenu de la note
        type:
          type: string
          description: Type de la note
        is_public:
          type: boolean
          description: Indique si la note est publique
        id_user:
          type: integer
          description: ID de l'utilisateur propriétaire
        id_project:
          type: integer
          description: ID du projet associé
        id_programming_language:
          type: integer
          description: ID du langage de programmation
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NoteCreate:
      type: object
      required:
        - title
        - content
        - id_user
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        type:
          type: string
        id_user:
          type: integer
        id_project:
          type: integer
        is_public:
          type: boolean
          default: false
        id_programming_language:
          type: integer

    NoteUpdate:
      type: object
      properties:
        user_id:
          type: integer
        title:
          type: string
        content:
          type: string
        is_public:
          type: boolean
        id_project:
          type: integer
        id_programming_language:
          type: integer

    Project:
      type: object
      properties:
        id_project:
          type: integer
        name:
          type: string
        description:
          type: string
        id_user:
          type: integer
          description: ID du propriétaire du projet
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required:
        - name
        - id_user
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        id_user:
          type: integer

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    Task:
      type: object
      properties:
        id_task:
          type: integer
        title:
          type: string
        description:
          type: string
        id_status:
          type: integer
        id_user:
          type: integer
        display_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id_comment:
          type: integer
        content:
          type: string
        id_user:
          type: integer
        id_item:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Tag:
      type: object
      properties:
        id_tag:
          type: integer
        name:
          type: string
        color:
          type: string

    Score:
      type: object
      properties:
        id_score:
          type: integer
        score:
          type: integer
          minimum: 1
          maximum: 5
        id_user:
          type: integer
        id_item:
          type: integer
        created_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id_message:
          type: integer
        content:
          type: string
        id_sender:
          type: integer
        id_receiver:
          type: integer
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    Share:
      type: object
      properties:
        id_share:
          type: integer
        id_item:
          type: integer
        id_user:
          type: integer
        shared_at:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id_role:
          type: integer
        name:
          type: string
        description:
          type: string

    ProgrammingLanguage:
      type: object
      properties:
        id_programming_language:
          type: integer
        name:
          type: string
        description:
          type: string

    TechnicalSkill:
      type: object
      properties:
        id_technical_skill:
          type: integer
        name:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 5
        id_user:
          type: integer

    Status:
      type: object
      properties:
        id_status:
          type: integer
        name:
          type: string
        description:
          type: string

security:
  - bearerAuth: []

paths:
  /login:
    post:
      tags:
        - Authentication
      summary: Connexion utilisateur
      description: Authentifie un utilisateur et retourne un token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: "john.doe"
              password: "SecureP@ss123"
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Invalid credentials"

  /user:
    get:
      tags:
        - Users
      summary: Liste tous les utilisateurs
      description: Récupère la liste complète des utilisateurs
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Non autorisé - Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Users
      summary: Créer un utilisateur
      description: Crée un nouveau compte utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              username: "john.doe"
              email: "john.doe@example.com"
              password: "SecureP@ss123"
              id_role: 2
              is_admin: false
      responses:
        '201':
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{id}:
    get:
      tags:
        - Users
      summary: Récupérer un utilisateur
      description: Récupère les détails d'un utilisateur spécifique
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Détails de l'utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Users
      summary: Mettre à jour un utilisateur
      description: Met à jour les informations d'un utilisateur existant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Utilisateur non trouvé

    delete:
      tags:
        - Users
      summary: Supprimer un utilisateur
      description: Supprime un utilisateur du système
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Utilisateur supprimé avec succès
        '404':
          description: Utilisateur non trouvé

  /user/{id}/note:
    get:
      tags:
        - Users
        - Notes
      summary: Liste les notes d'un utilisateur
      description: Récupère toutes les notes créées par un utilisateur spécifique
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Liste des notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'

  /user/{id}/project:
    get:
      tags:
        - Users
        - Projects
      summary: Liste les projets d'un utilisateur
      description: Récupère tous les projets associés à un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Liste des projets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'

    post:
      tags:
        - Users
        - Projects
      summary: Ajouter un utilisateur à un projet
      description: Associe un utilisateur à un projet existant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Utilisateur ajouté au projet

    delete:
      tags:
        - Users
        - Projects
      summary: Retirer un utilisateur d'un projet
      description: Dissocie un utilisateur d'un projet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Utilisateur retiré du projet

  /user/{id}/task:
    get:
      tags:
        - Users
        - Tasks
      summary: Liste les tâches d'un utilisateur
      description: Récupère toutes les tâches assignées à un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Liste des tâches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

  /user/{id}/message:
    get:
      tags:
        - Users
        - Messages
      summary: Liste les messages d'un utilisateur
      description: Récupère tous les messages reçus par un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Liste des messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'

    post:
      tags:
        - Users
        - Messages
      summary: Envoyer un message à un utilisateur
      description: Crée et envoie un nouveau message à un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur destinataire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                id_sender:
                  type: integer
      responses:
        '201':
          description: Message envoyé

    put:
      tags:
        - Users
        - Messages
      summary: Modifier un message d'un utilisateur
      description: Met à jour un message existant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Message modifié

  /user/{id}/technical-skill:
    get:
      tags:
        - Users
        - Technical Skills
      summary: Liste les compétences techniques d'un utilisateur
      description: Récupère toutes les compétences techniques d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Liste des compétences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechnicalSkill'

    post:
      tags:
        - Users
        - Technical Skills
      summary: Ajouter une compétence technique
      description: Ajoute une nouvelle compétence technique à un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '201':
          description: Compétence ajoutée

    put:
      tags:
        - Users
        - Technical Skills
      summary: Mettre à jour une compétence technique
      description: Met à jour le niveau d'une compétence technique
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Compétence mise à jour

    delete:
      tags:
        - Users
        - Technical Skills
      summary: Supprimer une compétence technique
      description: Supprime une compétence technique d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Compétence supprimée

  /user/{id}/upload:
    get:
      tags:
        - Users
        - Uploads
      summary: Liste les fichiers uploadés par un utilisateur
      description: Récupère tous les fichiers uploadés par un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur
      responses:
        '200':
          description: Liste des fichiers

  /note:
    get:
      tags:
        - Notes
      summary: Liste toutes les notes
      description: Récupère la liste complète des notes accessibles
      responses:
        '200':
          description: Liste des notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'

    post:
      tags:
        - Notes
      summary: Créer une note
      description: Crée une nouvelle note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
            example:
              title: "Ma nouvelle note"
              content: "Contenu de la note..."
              type: "code"
              id_user: 1
              id_project: 3
              is_public: false
              id_programming_language: 2
      responses:
        '201':
          description: Note créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'

  /note/{id}:
    get:
      tags:
        - Notes
      summary: Récupérer une note
      description: Récupère les détails d'une note spécifique
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la note
      responses:
        '200':
          description: Détails de la note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404':
          description: Note non trouvée

    put:
      tags:
        - Notes
      summary: Mettre à jour une note
      description: Met à jour une note existante
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdate'
      responses:
        '200':
          description: Note mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'

    delete:
      tags:
        - Notes
      summary: Supprimer une note
      description: Supprime une note du système
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la note
      responses:
        '200':
          description: Note supprimée avec succès

  /note/{id}/comment:
    get:
      tags:
        - Notes
        - Comments
      summary: Liste les commentaires d'une note
      description: Récupère tous les commentaires associés à une note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la note
      responses:
        '200':
          description: Liste des commentaires
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'

  /note/{id}/tag:
    get:
      tags:
        - Notes
        - Tags
      summary: Liste les tags d'une note
      description: Récupère tous les tags associés à une note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la note
      responses:
        '200':
          description: Liste des tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'

    post:
      tags:
        - Notes
        - Tags
      summary: Ajouter un tag à une note
      description: Associe un tag existant à une note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la note
      responses:
        '201':
          description: Tag ajouté

    put:
      tags:
        - Notes
        - Tags
      summary: Mettre à jour un tag d'une note
      description: Met à jour un tag associé à une note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la note
      responses:
        '200':
          description: Tag mis à jour

    delete:
      tags:
        - Notes
        - Tags
      summary: Retirer un tag d'une note
      description: Dissocie un tag d'une note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la note
      responses:
        '200':
          description: Tag retiré

  /note/{id}/share:
    get:
      tags:
        - Notes
        - Shares
      summary: Liste les partages d'une note
      description: Récupère tous les utilisateurs avec qui une note est partagée
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la note
      responses:
        '200':
          description: Liste des partages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Share'

    post:
      tags:
        - Notes
        - Shares
      summary: Partager une note avec un utilisateur
      description: Partage une note avec un ou plusieurs utilisateurs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_item:
                  type: integer
                id_user:
                  type: integer
      responses:
        '201':
          description: Note partagée

  /note/{id}/score:
    post:
      tags:
        - Notes
        - Scores
      summary: Ajouter un score à une note
      description: Attribue un score/note à une note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                id_user:
                  type: integer
                id_item:
                  type: integer
      responses:
        '201':
          description: Score ajouté

    put:
      tags:
        - Notes
        - Scores
      summary: Mettre à jour le score d'une note
      description: Modifie le score précédemment attribué à une note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
